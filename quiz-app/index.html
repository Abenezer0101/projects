<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calibration Quiz</title>
<style>
  :root{color-scheme:light;
    --plane:#f6f7f9;--surface:#fcfcfb;--border:rgba(12,18,32,.12);
    --text:#0b0b0b;--dim:#52514e;--mute:#82817c;
    --accent:#2a78d6;--good:#1d9a6c;--bad:#d6453f;--warn:#c98a1b}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
    --plane:#0f0f0e;--surface:#1a1a19;--border:rgba(255,255,255,.14);
    --text:#fff;--dim:#c3c2b7;--mute:#8f8e86;
    --accent:#4f96e8;--good:#3fbf8c;--bad:#e66767;--warn:#e0ab45}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--plane);color:var(--text);line-height:1.55;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;justify-content:center;padding:24px 16px}
  .wrap{width:100%;max-width:680px}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
  .lede{color:var(--dim);font-size:14px;margin:0 0 20px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}
  .meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--mute);margin-bottom:14px;flex-wrap:wrap}
  .tier{padding:2px 8px;border-radius:999px;border:1px solid var(--border);font-weight:600}
  .tier.easy{color:var(--good)} .tier.medium{color:var(--accent)}
  .tier.hard{color:var(--warn)} .tier.brutal{color:var(--bad)}
  .q{font-size:17px;font-weight:600;margin:0 0 16px;line-height:1.4}
  .opts{display:grid;gap:10px;grid-template-columns:1fr 1fr}
  @media(max-width:520px){.opts{grid-template-columns:1fr}}
  .opt{font:inherit;font-size:15px;font-weight:600;cursor:pointer;padding:14px 12px;
    border-radius:10px;border:1px solid var(--border);background:var(--plane);color:var(--text);
    text-align:center}
  .opt:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .opt:disabled{cursor:default}
  .opt.right{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
  .opt.wrong{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
  .conf{margin:16px 0 0}
  .conf p{font-size:12px;color:var(--mute);margin:0 0 7px}
  .lvls{display:flex;gap:8px}
  .lvl{flex:1;font:inherit;font-size:13px;cursor:pointer;padding:8px 4px;border-radius:8px;
    border:1px solid var(--border);background:var(--plane);color:var(--dim)}
  .lvl[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
  .reveal{margin-top:16px;font-size:14px;color:var(--dim);border-top:1px solid var(--border);padding-top:14px}
  .reveal b{color:var(--text)}
  .row{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}
  button.go{font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:9px 18px;border-radius:9px;
    border:1px solid var(--accent);background:var(--accent);color:#fff}
  button.go:disabled{opacity:.4;cursor:default}
  button.ghost{font:inherit;font-size:13px;cursor:pointer;padding:8px 14px;border-radius:9px;
    border:1px solid var(--border);background:var(--surface);color:var(--text)}
  .bar{height:5px;border-radius:3px;background:var(--border);overflow:hidden;margin-bottom:18px}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
  table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0 0}
  th,td{border-bottom:1px solid var(--border);padding:7px 6px;text-align:left}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:600}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .big{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0}
  .big small{display:block;font-size:12px;font-weight:500;color:var(--mute);letter-spacing:0}
  .scores{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:4px 0 18px}
  .note{font-size:12.5px;color:var(--mute);margin-top:14px;line-height:1.5}
  .err{color:var(--bad);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Calibration Quiz</h1>
  <p class="lede">Questions generated from real US Census and World Bank–style figures. It scores how well you know
    what you know, not just how much you get right.</p>
  <div class="bar"><i id="prog" style="width:0"></i></div>
  <div class="card" id="stage"><p class="err" id="boot">Loading data…</p></div>
</div>

<script type="module">
import { parseCSV, buildPool, makeQuiz, isCorrect, summarize, coinFlipShare } from './quiz.js';

const $ = id => document.getElementById(id);
const stage = $('stage');
const N = 12;
const LEVELS = [
  { p: 0.5,  label: 'Guessing' },
  { p: 0.75, label: 'Fairly sure' },
  { p: 1.0,  label: 'Certain' },
];
const fmt = new Intl.NumberFormat('en-US');

let quiz = [], at = 0, log = [], choice = null, confidence = null, pools = {};

const METRICS = [
  { file: 'us_states.csv', key: 'Population2020',        nameKey: 'State',
    label: 'a larger population in 2020', unit: 'people' },
  { file: 'us_states.csv', key: 'MedianHouseholdIncome', nameKey: 'State',
    label: 'a higher median household income', unit: 'USD' },
  { file: 'countries.csv', key: 'population_millions',   nameKey: 'country',
    label: 'a larger population', unit: 'million people' },
  { file: 'countries.csv', key: 'gdp_billions_usd',      nameKey: 'country',
    label: 'a larger GDP', unit: 'billion USD' },
];

async function boot() {
  try {
    const files = [...new Set(METRICS.map(m => m.file))];
    const texts = Object.fromEntries(await Promise.all(files.map(async f =>
      [f, await fetch(`./data/${f}`).then(r => { if (!r.ok) throw new Error(f); return r.text(); })])));
    pools = METRICS.map(m => buildPool(parseCSV(texts[m.file]), m));
    start(Date.now() % 100000);
  } catch (e) {
    stage.innerHTML = `<p class="err">Could not load the data files (${e.message}).
      This page reads CSVs, so it needs to be served over http rather than opened from disk.</p>`;
  }
}

function start(seed) {
  quiz = makeQuiz(pools, { n: N, seed });
  at = 0; log = []; choice = null; confidence = null;
  render();
}

function render() {
  $('prog').style.width = `${(at / N) * 100}%`;
  if (at >= quiz.length) return results();

  const q = quiz[at];
  stage.innerHTML = `
    <div class="meta"><span>Question ${at + 1} of ${quiz.length}</span></div>
    <p class="q">Which has ${q.metric.label}?</p>
    <div class="opts">
      <button class="opt" data-c="a"></button>
      <button class="opt" data-c="b"></button>
    </div>
    <div class="conf" id="confbox" hidden>
      <p>How sure are you?</p>
      <div class="lvls">${LEVELS.map((l, i) =>
        `<button class="lvl" data-p="${l.p}" aria-pressed="false">${l.label}</button>`).join('')}</div>
    </div>
    <div id="after"></div>`;

  // names come from the CSV, so they are set as text rather than interpolated
  const opts = stage.querySelectorAll('.opt');
  opts[0].textContent = q.a.name;
  opts[1].textContent = q.b.name;
  opts.forEach(b => b.addEventListener('click', () => pick(b.dataset.c)));
  expose();
}

function pick(c) {
  if (choice) return;
  choice = c;
  $('confbox').hidden = false;
  stage.querySelectorAll('.lvl').forEach(b =>
    b.addEventListener('click', () => commit(Number(b.dataset.p), b)));
}

function commit(p, btn) {
  if (confidence !== null) return;
  confidence = p;
  stage.querySelectorAll('.lvl').forEach(b => {
    b.setAttribute('aria-pressed', String(b === btn));
    b.disabled = true;
  });

  const q = quiz[at];
  const correct = isCorrect(q, choice);
  log.push({ correct, confidence, tier: q.tier, metric: q.metric.key, gap: q.gap });

  stage.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if (b.dataset.c === q.answer) b.classList.add('right');
    else if (b.dataset.c === choice) b.classList.add('wrong');
  });

  const hi = q.a.value > q.b.value ? q.a : q.b;
  const lo = q.a.value > q.b.value ? q.b : q.a;
  $('after').innerHTML =
    `<div class="reveal"><b>${correct ? 'Correct.' : 'Not this time.'}</b>
       <span id="fact"></span>
       <div class="meta" style="margin:10px 0 0">
         <span class="tier ${q.tier}">${q.tier}</span>
         <span>gap ${(q.gap * 100).toFixed(q.gap < 0.1 ? 1 : 0)}%</span>
       </div></div>
     <div class="row"><button class="go" id="next">${at + 1 < quiz.length ? 'Next' : 'See results'}</button></div>`;
  $('fact').textContent =
    ` ${hi.name} ${fmt.format(hi.value)} vs ${lo.name} ${fmt.format(lo.value)} ${q.metric.unit}` +
    ` — ${(q.gap * 100).toFixed(1)}% apart.`;
  $('next').addEventListener('click', () => { at++; choice = null; confidence = null; render(); });
  expose();
}

function results() {
  const s = summarize(log);
  const pct = x => `${Math.round(x * 100)}%`;
  const verdict = s.brier < 0.12 ? 'Well calibrated.'
                : s.brier < 0.25 ? 'Reasonably calibrated.'
                : 'Overconfident — the misses were mostly on answers you were sure about.';

  stage.innerHTML = `
    <div class="scores">
      <p class="big">${s.correct}/${s.n}<small>correct</small></p>
      <p class="big">${pct(s.accuracy)}<small>accuracy</small></p>
      <p class="big">${s.brier.toFixed(3)}<small>Brier score</small></p>
    </div>
    <p class="note"><b>${verdict}</b> A Brier score is the mean squared error of your stated confidence:
      0 is perfect, and answering “guessing” to everything scores 0.250. Being certain and wrong costs 1.000
      for that question, which is why confidence is worth spending carefully.</p>
    <table>
      <thead><tr><th>Difficulty</th><th class="num">Asked</th><th class="num">You got</th></tr></thead>
      <tbody>${s.byTier.map(r =>
        `<tr><td>${r.tier}</td><td class="num">${r.n}</td><td class="num">${pct(r.accuracy)}</td></tr>`).join('')}</tbody>
    </table>
    <table>
      <thead><tr><th>When you said</th><th class="num">Times</th><th class="num">Actually right</th></tr></thead>
      <tbody>${s.calibration.map(r =>
        `<tr><td>${pct(r.confidence)} sure</td><td class="num">${r.n}</td><td class="num">${pct(r.actual)}</td></tr>`).join('')}</tbody>
    </table>
    <p class="note">Difficulty is not a label anyone typed — it is the relative gap between the two real values.
      Across all 1,275 state pairs, ${pct(coinFlipShare(pools[1]))} differ in median household income by under 5%,
      against ${pct(coinFlipShare(pools[0]))} for population. Income questions are harder because incomes
      genuinely sit closer together.</p>
    <div class="row">
      <button class="go" id="again">New quiz</button>
      <button class="ghost" id="retry">Replay these questions</button>
    </div>`;
  $('prog').style.width = '100%';
  $('again').addEventListener('click', () => start(Date.now() % 100000));
  $('retry').addEventListener('click', () => { at = 0; log = []; choice = null; confidence = null; render(); });
  expose();
}

function expose() {
  window.__quiz = { at, total: quiz.length, log: log.slice(),
                    summary: log.length ? summarize(log) : null,
                    question: quiz[at] ? { tier: quiz[at].tier, answer: quiz[at].answer,
                                           a: quiz[at].a.name, b: quiz[at].b.name } : null };
}

boot();
</script>
</body>
</html>
