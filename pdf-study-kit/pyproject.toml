[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-study-kit"
version = "1.0.0"
description = "Turn a PDF into an outline, summary, glossary, flashcards or quiz — entirely offline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abenezer Bekele" }]
keywords = ["pdf", "study", "flashcards", "summarization", "tf-idf", "offline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Education",
]
dependencies = ["pypdf>=4.0"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
dev = ["reportlab>=4.0"]

[project.scripts]
pdf-study-kit = "pdf_study_kit.cli:main"

[tool.setuptools.packages.find]
include = ["pdf_study_kit*"]
