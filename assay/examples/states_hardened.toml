name = "US states (hardened after audit)"
source = "examples/states.csv"

[[rule]]
id = "state_present"
kind = "not_null"
column = "State"

[[rule]]
id = "state_unique"
kind = "unique"
columns = ["State"]

[[rule]]
id = "region_known"
kind = "in_set"
column = "Region"
allowed = ["Northeast", "Midwest", "South", "West"]

[[rule]]
id = "population_is_number"
kind = "is_type"
column = "Population2020"
type = "int"

[[rule]]
id = "population_plausible"
kind = "range"
column = "Population2020"
min = 100000
max = 60000000

[[rule]]
id = "income_is_number"
kind = "is_type"
column = "MedianHouseholdIncome"
type = "int"

[[rule]]
id = "fifty_states_plus_dc"
kind = "row_count"
min = 51
max = 51

# ---- added after `assay audit` reported a 62% detection score ----
# Each of these closes a specific corruption the original suite let through.

[[rule]]
id = "population_present"          # audit: blank_out slipped past every rule,
kind = "not_null"                  # because range and is_type both skip nulls
column = "Population2020"

[[rule]]
id = "income_present"
kind = "not_null"
column = "MedianHouseholdIncome"

[[rule]]
id = "state_not_padded"            # audit: pad_whitespace was invisible
kind = "no_padding"
column = "State"

[[rule]]
id = "code_is_two_letters"         # audit: State/StateCode swap went unnoticed
kind = "matches"
column = "StateCode"
pattern = "[A-Z]{2}"

[[rule]]
id = "code_unique"
kind = "unique"
columns = ["StateCode"]

[[rule]]
id = "population_control_total"    # audit: a x10 decimal shift stayed inside
kind = "control_total"             # the plausible per-row range. Only an
column = "Population2020"          # aggregate can see it.
stat = "sum"
expected = 331449281
tolerance = 0.005
