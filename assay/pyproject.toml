[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assay"
version = "0.1.0"
description = "A data quality gate that audits its own rules by corrupting data on purpose"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["data-quality", "validation", "etl", "data-engineering", "testing"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
  "License :: OSI Approved :: MIT License",
]
dependencies = []          # stdlib only -- tomllib ships with 3.11

[project.scripts]
assay = "assay.cli:main"

[tool.setuptools.packages.find]
include = ["assay*"]
